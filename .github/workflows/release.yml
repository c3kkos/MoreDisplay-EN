name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.1-en)'
        required: true
        default: 'v1.1-en'

# Tag pushes use the pushed tag; manual runs use the `tag` input
# (GITHUB_REF_NAME would be the branch name, e.g. `main`, on a manual run).
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.ver.outputs.version_name }}
      version_code: ${{ steps.ver.outputs.version_code }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # Same as ci.yml: use the runner's bundled SDK and let AGP download missing components.
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build signed release APKs
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :probe:assembleRelease --console=plain

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          ./gradlew :app:printVersion --console=plain -q \
            | grep -E '^VERSION_(NAME|CODE)=' \
            | sed 's/^VERSION_NAME=/version_name=/; s/^VERSION_CODE=/version_code=/' \
            >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Rename APKs
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             "out/MoreDisplay-${{ steps.ver.outputs.version_name }}.apk"
          cp probe/build/outputs/apk/release/probe-release.apk \
             "out/MoreDisplayProbe-${{ steps.ver.outputs.version_name }}.apk"
          ls -l out

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          gh release create "$TAG" \
            --title "${{ steps.ver.outputs.version_name }}" \
            --generate-notes \
            out/*.apk
          gh release view "$TAG" --json body --jq .body > out/release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: out/release-notes.md

  # Push metadata and the APK to the official module repository Xposed-Modules-Repo/<package> (used by the LSPosed / Vector managers).
  # Skipped entirely when LSPOSED_REPO_TOKEN (a PAT with write access to that repository) is not configured;
  # in that case publish locally with scripts/publish-lsposed.sh instead.
  # Note: the secrets context cannot be used in a job-level if, so the check lives inside the step.
  publish-lsposed:
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.LSPOSED_REPO_TOKEN }}
      VERSION_NAME: ${{ needs.release.outputs.version_name }}
      VERSION_CODE: ${{ needs.release.outputs.version_code }}
    steps:
      - uses: actions/checkout@v7

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Download signed APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          gh release download "$TAG" --dir out --pattern '*.apk'
          # The module repository only carries the module itself; probe is an acceptance-test tool and is not distributed with it.
          rm -f out/MoreDisplayProbe-*.apk

      - name: Publish to Xposed-Modules-Repo
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "LSPOSED_REPO_TOKEN is not set, skipping publish to Xposed-Modules-Repo."
            exit 0
          fi
          ./scripts/publish-lsposed.sh "$VERSION_CODE-$VERSION_NAME" "$VERSION_NAME" \
            release-notes.md out/*.apk
