name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # The runner image ships an Android SDK; missing platforms / build-tools are downloaded by AGP itself.
      # Don't use android-actions/setup-android: its default packages include the removed `tools` package,
      # which fails outright on recent cmdline-tools.
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build debug APKs
        run: ./gradlew :app:assembleDebug :probe:assembleDebug --console=plain

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :probe:testDebugUnitTest --console=plain

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: moredisplay-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            probe/build/outputs/apk/debug/*.apk
          if-no-files-found: error
